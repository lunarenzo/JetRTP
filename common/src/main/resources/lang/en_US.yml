update-checker:
  running-latest: "<white>You are running the latest version of <plugin_name>!"
  update-found-console: |


    <white>An update was found for <plugin_name>!
        <white>Current version: <red>v<version_current>
        <white>Latest version: <green><click:open_url:'<download_link>'><hover:show_text:'<green>Open Download Page'>v<version_latest></hover></click>
  update-found-player: |

    <white>An update was found for <plugin_name>!
      <dark_gray>• <white>Current version: <red>v<version_current>
      <dark_gray>• <white>Latest version: <green><click:open_url:'<download_link>'><hover:show_text:'<green>Open Download Page'>v<version_latest></hover></click>
  update-failed: "<yellow>Failed to fetch latest version, error: <error>"

commands:
  translation:
    help: |

      <white>Translations subcommands:
        <dark_gray>• <white>reload: <gray><i>Reloads the translation files.
        <dark_gray>• <white>test <node>: <gray><i>Test a translation.
    reloaded: "<green>Successfully reloaded translations!"
    test:
      not-string: "<red>Translation node must be a string!"
      not-empty: "<red>Translation node \"<u><node></u>\" cannot be empty!"
      illegal: "<red>Translation node \"<u><node></u>\" cannot begin or end with a period!"
      not-found: "<red>Translation entry for node \"<u><node></u>\" doesn't exist!"
      not-empty2: "<red>Translation entry for node \"<u><node></u>\" is empty!"
  dump:
    success: "<green>Successfully uploaded dump to <hover:show_text:'Click to open link'><click:open_url:'<link>'><u><link></u></click></hover>."
    failure: "<red>Failed to upload dump: <error>"
    dumping: "<green>Gathering dump information and uploading to mclo.gs..."

rtp:
  only-players: "<red>Only players can run this command."
  unknown-profile: "<red>Unknown RTP profile: <yellow><profile>"
  no-permission: "<red>You do not have permission to use the profile: <yellow><profile>"
  cooldown: "<red>You must wait <yellow><remaining></yellow> seconds before using RTP again."
  teleport-failed: "<red>Teleportation could not be completed at this time."
  reloaded: "<green>JetRTP profiles and configuration reloaded."
  target-not-found: "<red>Target player not found."
  force-config: "<green>Forcefully executing random teleport for <white><target></white> using profile <white><profile>"
  force-world: "<green>Forcefully executing random teleport for <white><target></white> landing in world <white><world>"
  force-success: "<green>Randomly teleported <white><target></white> successfully."
  force-failed: "<red>Failed to randomly teleport <white><target></white>"
  no-profile-resolved: "<red>No RTP profile could be resolved."

info:
  general-header: "<dark_gray>=== <green>JetRTP General Info <dark_gray>==="
  loaded-profiles: "<gray>Loaded Profiles: <white><count>"
  database-active: "<gray>Database Active: <white><status>"
  profile-entry: "<dark_gray>- <green><profile><gray>: Cache = <white><cache>/<max>"
  profile-header: "<dark_gray>=== <green>JetRTP Profile Info: <white><profile> <dark_gray>==="
  profile-enabled: "<gray>Enabled: <white><status>"
  profile-world: "<gray>Landing World: <white><world>"
  profile-cache: "<gray>Cache Size: <white><cache> / <max>"
  profile-cooldown: "<gray>Cooldown Time: <white><cooldown>s"
  profile-cost: "<gray>Cost: <white>$<cost>"
  profile-bounds: "<gray>Bounds: <white>Y <low> to <high>"
  profile-biomes: "<gray>Excluded Biomes: <white><biomes>"

settings:
  unknown-key: "<red>Unknown settings key: <yellow><key>"
  invalid-value: "<red>Invalid value for setting: <yellow><value>"
  success: "<green>Successfully updated setting <white><key></white> to <white><value></white> in profile <white><profile>"
